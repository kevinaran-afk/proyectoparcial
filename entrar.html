<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — EProfile</title>
<link rel="stylesheet" href="/assets/css/estilos.css">
</head>
<body>

<header class="barra" id="barra"></header>

<main class="principal">
  <div class="envoltura envoltura--angosta" style="max-width:430px">

    <div class="encabezado-pagina">
      <h1>Iniciar sesión</h1>
      <p>Accede con la cuenta que te asignó la administración de la plataforma.</p>
    </div>

    <div class="tarjeta">
      <div id="aviso" hidden></div>

      <form id="forma-entrar" novalidate>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="boton boton--primario" type="submit" id="boton-entrar" style="width:100%">Entrar</button>
      </form>
    </div>

    <p style="margin-top:20px;font-size:13px;color:var(--tenue)">
      ¿Solo quieres consultar un perfil? No necesitas iniciar sesión:
      <a href="/">vuelve al inicio</a>.
    </p>

  </div>
</main>

<script src="/assets/js/comun.js"></script>
<script src="/assets/js/entrar.js"></script>
</body>
</html>
